# .dogfood.toml — DOGFOOD 2026 acceptance wiring (spec: dogfoodhack.com/spec).
# run.py reads ONLY [portal], [tiers].claimed, [auth], [routes]. Everything
# else is for human judges. Tier claims below are exactly what run.py verified.

[portal]
# Where the portal listens after `docker compose up`.
base_url = "http://localhost:3000"

[tiers]
# Claimed on honour and checked: run.py prints verified next to claimed.
claimed = ["T1", "T2"]
pitch = "Other judging tools give you a leaderboard. OpenJudge tells you whether to trust it — four ranking rules, a ROBUST/FRAGILE certificate per prize boundary, and an evidence receipt every team can contest."

[auth]
# Session cookies seeded by db/seed_fixtures.sql (deterministic tokens).
# The checker never logs in, it just attaches these. Printed on first boot.
organizer   = "Cookie: oj_session=df-org-7f2a9c"
judge_a     = "Cookie: oj_session=df-jdga-91bc4e"
judge_b     = "Cookie: oj_session=df-jdgb-44de8a"
participant = "Cookie: oj_session=df-prt-2e88f1"

[routes]
gallery      = "/projects"
submit       = "/api/submissions"
judge_scores = "/api/judge/scores"
# peer_scores is the url that returns judge_a's scores (by email here).
# The checker visits it as judge_b, who must be refused 401/403.
peer_scores  = "/api/judge/scores?judge=tomas.varga@example.org"
csv_export   = "/api/export.csv"

# Beyond run.py: what human judges should look at (T3/T4 + bonuses).
[tiers_extra]
t3 = true
t4 = true
t3_notes = "Community voting (one-person-one-vote + quadratic, hidden until published, randomized ballots, rate limits), comments with moderation."
t4_notes = "REST + OpenAPI (/api/openapi.json), HMAC webhooks, embeddable gallery (/embed/gallery), bulk export/import."

[bonuses]
normalization_proof = true
pairwise_mode = true
threat_model = true
api_first = true

[known_gaps]
gaps = [
  "signed judge participation records not issued",
  "no email delivery for team invites (links are copy-paste)",
  "voting is authenticated or email-hashed; fully anonymous open-link ballots not implemented",
  "admin role merged into organizer (visitor/participant/judge/organizer enforced)",
]
