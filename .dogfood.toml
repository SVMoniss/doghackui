# .dogfood.toml — honest tier declaration for DOGFOOD 2026
# Rules: claim honestly; the acceptance report is the receipt, not this file.
# Overclaiming costs more than the tier was worth.

[event]
name = "OpenJudge"
pitch = "Other judging tools give you a leaderboard. OpenJudge tells you whether to trust it — four ranking rules, a ROBUST/FRAGILE certificate per prize boundary, and an evidence receipt every team can contest."

[tiers]
# T1 is the floor: auth, roles, event, submission, gallery. Claimed: our
# acceptance suite verifies gates, draft/submit, teams+invites, deadline,
# search/filter, prizes, media, questions, gallery+detail, receipts.
t1 = true
# T2 judging integrity: assignment, weighted rubrics, backend isolation
# (incl. track scopes), normalization, CSV at every stage, certificates,
# audit trail, freeze, evidence strip. Claimed, verified by suite.
t2 = true
# T3 public: voting (open/quadratic, hidden-until-published, randomized
# ballots, rate limits), comments with moderation. Claimed, verified by suite.
t3 = true
# T4 stretch: REST + OpenAPI, webhooks, embeddable gallery, bulk
# import/export, certificates. Claimed with one gap (below).
t4 = true

[known_gaps]
gaps = [
  "signed judge participation records not issued (the one T4 item missing)",
  "no email delivery for team invites (links are copy-paste)",
  "voting is authenticated or email-hashed; fully anonymous open-link ballots not implemented",
  "admin role merged into organizer (visitor/participant/judge/organizer enforced)",
  "full-project tsc is too heavy for <8GB laptops; verified via subset typechecks + vite build + e2e",
]

[bonuses]
# One done properly beats four started. Claimed:
normalization_proof = true   # z-score calibration + raw-vs-normalized rank movement on fixture data
# Real pairwise UI mode shipped (judge picks A-or-B, Bradley-Terry ranking
# in admin). Claimed.
pairwise_mode = true
threat_model = true          # THREAT-MODEL.md
# Every UI action mirrored in REST with a published OpenAPI spec. Claimed.
api_first = true
