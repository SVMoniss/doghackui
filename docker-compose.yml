services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openjudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openjudge}
      POSTGRES_DB: ${POSTGRES_DB:-openjudge}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Applied in filename order on first boot of an empty volume.
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-openjudge.sh:ro
      - ./db/seed.sql:/opt/openjudge/seed.sql:ro
      - ./db/seed_mesh.sql:/opt/openjudge/seed_mesh.sql:ro
      - ./db/seed_prizes.sql:/opt/openjudge/seed_prizes.sql:ro
      - ./db/seed_accounts.sql:/opt/openjudge/seed_accounts.sql:ro
      - ./db/seed_fixtures.sql:/opt/openjudge/seed_fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openjudge} -d ${POSTGRES_DB:-openjudge}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openjudge}:${POSTGRES_PASSWORD:-openjudge}@db:5432/${POSTGRES_DB:-openjudge}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
